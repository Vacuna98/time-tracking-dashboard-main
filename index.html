<!DOCTYPE html>

    <link

      type="image/png"

    <link rel="stylesheet" href="./styles/styles.css" />

    <title>Frontend Mentor | Time tracking dashboard</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->

        </div>
      </div>

      <span class="dots">•••</span>

</div>
